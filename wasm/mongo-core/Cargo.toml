[package]
name = "mongo-core"
version = "0.1.0"
edition = "2024"
description = "MongoDB log parse + reagg kernel for browser Wasm"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.126"
hashbrown = "0.17"
rapidhash = "4"
memchr = "2.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
