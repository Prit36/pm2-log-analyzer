[package]
name = "nginx-core"
version = "0.1.0"
edition = "2024"
description = "Nginx combined access log parser and aggregation for Wasm and native"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.126"
hashbrown = "0.17"
memchr = "2.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pm2-core = { path = "../pm2-core", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
