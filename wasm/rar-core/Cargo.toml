[package]
name = "rar-core"
version = "0.1.0"
edition = "2024"
description = "Streaming RAR extraction for browser Wasm"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.126"
js-sys = "=0.3.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unrar-rs = { path = "../vendor/unrar-rs", default-features = false, features = ["crypto-rust"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
