[package]
name = "zip-core"
version = "0.1.0"
edition = "2024"
description = "Fast ZIP and GZ extraction and log classification for browser Wasm"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.126"
js-sys = "0.3.73"
zlib-rs = { version = "0.6", default-features = false, features = ["rust-allocator"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
