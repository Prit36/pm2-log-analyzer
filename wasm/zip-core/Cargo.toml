[package]
name = "zip-core"
version = "0.1.0"
edition = "2024"
description = "Fast ZIP and GZ extraction and log classification for browser Wasm"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.126"
js-sys = "0.3.103"
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["bzip2", "ppmd", "deflate"] }
pbz2-core = { version = "0.2.0", features = ["simd"] }
lzma-rust2 = { version = "0.22.0", default-features = false, features = [
  "std",
  "optimization",
  "xz",
] }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zlib-rs = { version = "0.6", default-features = false, features = [
  "rust-allocator",
  "__internal-api",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
