[package]
name = "pm2-core"
version = "0.1.0"
edition = "2021"
description = "PM2 log parse + reagg kernel for browser Wasm"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
ahash = { version = "0.8.12", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Enable bulk memory; SIMD via RUSTFLAGS in wasm:build when desired.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-simd"]
