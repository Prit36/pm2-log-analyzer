[package]
name = "pm2-core"
version = "0.1.0"
edition = "2024"
description = "PM2 log parse + reagg kernel for browser Wasm"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# CLI must match crate version exactly (`cargo install -f wasm-bindgen-cli --version 0.2.126`).
wasm-bindgen = "=0.2.126"
# SwissTable + foldhash default (RelHist i32 buckets). Byte-key maps use rapidhash below.
hashbrown = "0.17"
# Faster than foldhash on byte/string keys (path intern).
rapidhash = "4"
memchr = "2.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-simd", "--enable-relaxed-simd", "--enable-tail-call", "--enable-extended-const", "--enable-mutable-globals", "--enable-sign-ext"]
